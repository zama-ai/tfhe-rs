version: 2

updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      # Check for updates to GitHub Actions every sunday
      interval: "weekly"
      day: "sunday"
    cooldown:
      default-days: 7

  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/apps/princev2"
      - "/apps/trivium"
      - "/utils/tfhe-lints"
      - "/utils/tfhe-forward-compat-matrices/*"
      - "/utils/tfhe-backward-compat-data/crates/*"
    schedule:
      # Routine version bumps monthly to limit churn. Security fixes are handled
      # separately and immediately by Dependabot security updates.
      interval: "monthly"
    cooldown:
      default-days: 7
    allow:
      - dependency-type: "direct"
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        # Groups multiple minor or patch updates in a single pr
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directories:
      - "/tfhe/js_on_wasm_tests"
      - "/tfhe/web_wasm_parallel_tests"
      - "/tfhe/tests/zk_wasm_x86_test"
      - "/tfhe/tests/transciphering_wasm_x86_test"
      - "/utils/wasm-par-mq"
      - "/utils/wasm-par-mq/web_tests"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        applies-to: version-updates
        group-by: dependency-name
        update-types:
          - "minor"
          - "patch"
