# CPU integer tests of the tier 3 parameters (see CPU_INTEGER_TIERS in scripts/test_filtering.py).
# Tier 0 (prod params) runs in aws_tfhe_integer_tests, on approval and on each merge to main.
name: aws_tfhe_integer_tests_tier_3

on:
  # Run tier 3 on any branch
  workflow_dispatch:
    inputs:
      profile:
        description: "Test profile of the radix test harness"
        type: choice
        options:
          - cpu_light
          - cpu_baseline
          - cpu_extensive
          - cpu_fhevm
        default: cpu_light
  schedule:
    # Tier 3, weekly
    - cron: "0 4 * * SAT"

permissions:
  contents: read

jobs:
  integer-tests:
    name: aws_tfhe_integer_tests_tier_3/integer-tests
    if: github.event_name == 'workflow_dispatch' || github.repository == 'zama-ai/tfhe-rs'
    # Runs on main are not cancelled by the next one
    concurrency:
      group: ${{ github.workflow_ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    uses: ./.github/workflows/aws_tfhe_integer_tests_common.yml
    with:
      tiers: "3"
      # Scheduled runs have no inputs
      profile: ${{ inputs.profile || 'cpu_light' }}
    secrets:
      REPO_CHECKOUT_TOKEN: ${{ secrets.REPO_CHECKOUT_TOKEN }}
      SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
      BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
