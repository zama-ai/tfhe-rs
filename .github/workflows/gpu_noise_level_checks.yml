# Run signed and unsigned GPU integer tests with the gpu-debug-noise-check
# feature so that the CHECK_NOISE_LEVEL assertions in the CUDA backend are
# active, without the multi-GPU emulation that requires a multi-GPU host.
# Runs on a single L40S Scaleway instance (Hyperstack fallback), triggered
# automatically on every PR that touches GPU code, alongside gpu_fast_tests.
name: gpu_noise_level_checks

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C target-cpu=native"
  RUST_BACKTRACE: "full"
  RUST_MIN_STACK: "8388608"
  IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
  CHECKOUT_TOKEN: ${{ secrets.REPO_CHECKOUT_TOKEN || secrets.GITHUB_TOKEN }}
  GPU_FEATURE: gpu-debug-noise-check
  FAST_TESTS: TRUE
  NIGHTLY_TESTS: FALSE

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

# zizmor: ignore[concurrency-limits] concurrency is managed after instance setup to ensure safe provisioning

jobs:
  should-run:
    name: gpu_noise_level_checks/should-run
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # Needed to check for file change
    outputs:
      gpu_test: ${{ env.IS_PULL_REQUEST == 'false' || steps.changed-files.outputs.gpu_any_changed }}
    steps:
      - name: Checkout tfhe-rs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: "false"
          token: ${{ env.CHECKOUT_TOKEN }}

      - name: Check for file changes
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_yaml: |
            gpu:
              - tfhe/Cargo.toml
              - tfhe/build.rs
              - backends/tfhe-cuda-backend/**
              - tfhe/src/core_crypto/gpu/**
              - tfhe/src/integer/gpu/**
              - tfhe/src/integer/server_key/radix_parallel/tests_unsigned/**
              - tfhe/src/integer/server_key/radix_parallel/tests_signed/**
              - tfhe/src/integer/server_key/radix_parallel/tests_cases_unsigned.rs
              - tfhe/src/shortint/parameters/**
              - .github/workflows/gpu_noise_level_checks.yml
              - scripts/integer-tests.sh
              - '.github/actions/gpu_setup/action.yml'
              - ci/slab.toml

  setup-instance:
    name: gpu_noise_level_checks/setup-instance
    needs: should-run
    if: github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'approved' && needs.should-run.outputs.gpu_test == 'true')
    uses: ./.github/workflows/slab_setup.yml
    with:
      backend: terraform
      profile: scaleway-small-gpu-noise-check
      fallback-runner: gpu_ubuntu-22.04
    secrets:
      SLAB_ACTION_TOKEN: ${{ secrets.SLAB_ACTION_TOKEN }}
      SLAB_BASE_URL: ${{ secrets.SLAB_BASE_URL }}
      JOB_SECRET: ${{ secrets.JOB_SECRET }}

  cuda-noise-check-tests:
    name: gpu_noise_level_checks/cuda-noise-check-tests
    needs: [should-run, setup-instance]
    if: github.event_name != 'pull_request' ||
      (github.event_name == 'pull_request' && needs.setup-instance.result != 'skipped')
    concurrency:
      group: ${{ github.workflow_ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ${{ needs.setup-instance.outputs.runner-name }}
    timeout-minutes: 720 # 12 hours
    strategy:
      fail-fast: false
      # explicit include-based build matrix, of known valid options
      matrix:
        include:
          - os: ubuntu-22.04
            cuda: "12.8 12.2"
            gcc: 12
    steps:
      - name: Checkout tfhe-rs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
          token: ${{ env.CHECKOUT_TOKEN }}

      - name: Setup cloud GPU machine dependencies
        uses: ./.github/actions/gpu_setup
        with:
          cuda-version: ${{ matrix.cuda }}
          gcc-version: ${{ matrix.gcc }}
          cloud-provider: ${{ needs.setup-instance.outputs.cloud-provider }}

      - name: Install latest stable
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # zizmor: ignore[stale-action-refs] this action doesn't create releases
        with:
          toolchain: stable

      - name: Enable nvidia multi-process service
        run: |
          nvidia-cuda-mps-control -d

      - name: Run HL GPU tests with noise checks enabled
        run: |
          make test_high_level_api_fake_multi_gpu

      - name: Run integer GPU tests with noise checks enabled
        run: |
          make test_signed_integer_fake_multi_gpu

  slack-notify:
    name: gpu_noise_level_checks/slack-notify
    needs: [setup-instance, cuda-noise-check-tests]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.cuda-noise-check-tests.result != 'skipped' && failure() }}
    continue-on-error: true
    steps:
      - name: Checkout notification action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
          token: ${{ env.CHECKOUT_TOKEN }}
          sparse-checkout: .github/actions/slack_notify

      - name: Send message
        uses: ./.github/actions/slack_notify
        with:
          status: ${{ needs.cuda-noise-check-tests.result }}
          message: "GPU noise check tests finished with status: ${{ needs.cuda-noise-check-tests.result }}."
          slack-webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack-channel: ${{ secrets.SLACK_CHANNEL }}
          slack-username: ${{ secrets.BOT_USERNAME }}
          pull-request-base-url: ${{ vars.PR_BASE_URL }}

  teardown-instance:
    name: gpu_noise_level_checks/teardown-instance
    if: ${{ always() && needs.setup-instance.outputs.runner-name != '' }}
    needs: [setup-instance, cuda-noise-check-tests]
    uses: ./.github/workflows/slab_teardown.yml
    with:
      runner-name: ${{ needs.setup-instance.outputs.runner-name }}
      notification-context: gpu-noise-check
    secrets:
      SLAB_ACTION_TOKEN: ${{ secrets.SLAB_ACTION_TOKEN }}
      SLAB_BASE_URL: ${{ secrets.SLAB_BASE_URL }}
      JOB_SECRET: ${{ secrets.JOB_SECRET }}
      SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
      BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
