# Run the GPU integer noise and pfail tests on demand, for one atomic pattern, one kind of
# test (noise, pfail or both) and one parameters set (or all of them) on a single H100.
# The tests live in tfhe/src/integer/gpu/server_key/radix/tests_noise_distribution; the
# sanity checks declared next to them are deliberately not run here.
# The available combinations are derived from the sources by ci/gpu_noise_tests.py
# (`python3 ci/gpu_noise_tests.py list`); the inputs are validated before any instance
# is started, and each test gets its own green/red line in the job summary.
name: gpu_noise_pfail_tests

run-name: ${{ inputs.pattern }} / ${{ inputs.test_kind }} / ${{ inputs.params }} (${{ inputs.platform }})

env:
  CARGO_TERM_COLOR: always
  ACTION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  RUSTFLAGS: "-C target-cpu=native"
  RUST_BACKTRACE: "full"
  RUST_MIN_STACK: "8388608"
  SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
  SLACK_ICON: https://pbs.twimg.com/profile_images/1274014582265298945/OjBKP9kn_400x400.png
  SLACK_USERNAME: ${{ secrets.BOT_USERNAME }}
  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
  SLACKIFY_MARKDOWN: true
  CHECKOUT_TOKEN: ${{ secrets.REPO_CHECKOUT_TOKEN || secrets.GITHUB_TOKEN }}

on:
  workflow_dispatch:
    inputs:
      pattern:
        description: "Atomic pattern (test module)"
        required: true
        type: choice
        options:
          - br_dp_ks_ms
          - br_dp_packingks_ms
          - br_rerand_dp_ks_ms
          - cpk_ks_ms
          - dp_ks_ms
          - dp_ks_pbs_128_packingks
      test_kind:
        description: "Tests to run"
        required: true
        type: choice
        default: both
        options:
          - noise
          - pfail
          - both
      params:
        description: "Parameters set, must exist for the selected pattern and tests (see `python3 ci/gpu_noise_tests.py list`)"
        required: true
        type: choice
        default: all
        options:
          - all
          - TEST_LEGACY_RERAND_META_PARAM_CPU_2_2_KS_PBS_PKE_TO_SMALL_ZKV2_TUNIFORM_2M128
          - TEST_META_PARAM_CPU_2_2_KS_PBS_GAUSSIAN_2M128
          - TEST_META_PARAM_CPU_2_2_KS_PBS_PKE_TO_SMALL_ZKV2_TUNIFORM_2M128
          - TEST_META_PARAM_GPU_2_2_MULTI_BIT_GROUP_4_KS_PBS_PKE_TO_SMALL_ZKV2_TUNIFORM_2M128
      platform:
        description: "GPU platform"
        required: true
        type: choice
        default: 1xH100
        options:
          - 1xH100

permissions:
  contents: read

# zizmor: ignore[concurrency-limits] only Zama organization members can trigger this workflow, each run gets its own instance

jobs:
  parse-inputs:
    name: gpu_noise_pfail_tests/parse-inputs
    runs-on: ubuntu-latest
    outputs:
      noise_tests: ${{ steps.resolve.outputs.noise_tests }}
      pfail_tests: ${{ steps.resolve.outputs.pfail_tests }}
      backend: ${{ steps.resolve.outputs.backend }}
      profile: ${{ steps.resolve.outputs.profile }}
    steps:
      - name: Checkout tfhe-rs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
          token: ${{ env.CHECKOUT_TOKEN }}

      - name: Check workflow options are in sync with the sources
        run: |
          python3 ci/gpu_noise_tests.py check-workflow

      - name: Resolve selected tests and platform
        id: resolve
        env:
          INPUTS_PATTERN: ${{ inputs.pattern }}
          INPUTS_TEST_KIND: ${{ inputs.test_kind }}
          INPUTS_PARAMS: ${{ inputs.params }}
          INPUTS_PLATFORM: ${{ inputs.platform }}
        run: |
          python3 ci/gpu_noise_tests.py resolve \
            --pattern "${INPUTS_PATTERN}" \
            --test-kind "${INPUTS_TEST_KIND}" \
            --params "${INPUTS_PARAMS}" \
            --platform "${INPUTS_PLATFORM}" \
            --output "${GITHUB_OUTPUT}"

  setup-instance:
    name: gpu_noise_pfail_tests/setup-instance
    needs: parse-inputs
    uses: ./.github/workflows/slab_setup.yml
    with:
      backend: ${{ needs.parse-inputs.outputs.backend }}
      profile: ${{ needs.parse-inputs.outputs.profile }}
    secrets:
      SLAB_ACTION_TOKEN: ${{ secrets.SLAB_ACTION_TOKEN }}
      SLAB_BASE_URL: ${{ secrets.SLAB_BASE_URL }}
      JOB_SECRET: ${{ secrets.JOB_SECRET }}

  noise-pfail-tests:
    name: gpu_noise_pfail_tests/noise-pfail-tests
    needs: [parse-inputs, setup-instance]
    runs-on: ${{ needs.setup-instance.outputs.runner-name }}
    timeout-minutes: 1440 # 24 hours, the pfail tests are long
    strategy:
      fail-fast: false
      # explicit include-based build matrix, of known valid options
      matrix:
        include:
          - os: ubuntu-22.04
            cuda: "12.8 12.2"
            gcc: 12
    env:
      NOISE_TESTS: ${{ needs.parse-inputs.outputs.noise_tests }}
      PFAIL_TESTS: ${{ needs.parse-inputs.outputs.pfail_tests }}
    steps:
      - name: Checkout tfhe-rs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
          token: ${{ env.CHECKOUT_TOKEN }}

      - name: Setup cloud GPU machine dependencies
        uses: ./.github/actions/gpu_setup
        with:
          cuda-version: ${{ matrix.cuda }}
          gcc-version: ${{ matrix.gcc }}
          cloud-provider: ${{ needs.setup-instance.outputs.cloud-provider }}

      - name: Install latest stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # zizmor: ignore[stale-action-refs] this action doesn't create releases
        with:
          toolchain: stable

      - name: Enable nvidia multi-process service
        run: |
          nvidia-cuda-mps-control -d

      - name: Build GPU tests
        run: |
          cargo test --profile release --features=boolean,shortint,integer,gpu -p tfhe --lib --no-run

      - name: Run noise tests
        if: ${{ !cancelled() && env.NOISE_TESTS != '' }}
        run: |
          python3 ci/gpu_noise_tests.py run --kind noise --tests "${NOISE_TESTS}" --summary "${GITHUB_STEP_SUMMARY}"

      - name: Run pfail tests
        if: ${{ !cancelled() && env.PFAIL_TESTS != '' }}
        run: |
          python3 ci/gpu_noise_tests.py run --kind pfail --tests "${PFAIL_TESTS}" --summary "${GITHUB_STEP_SUMMARY}"

      - name: Upload tests results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tests_results_${{ inputs.pattern }}_${{ inputs.test_kind }}_${{ inputs.params }}
          path: tfhe/tests_results/
          if-no-files-found: warn

  slack-notify:
    name: gpu_noise_pfail_tests/slack-notify
    needs: [setup-instance, noise-pfail-tests]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.noise-pfail-tests.result != 'skipped' && failure() }}
    continue-on-error: true
    steps:
      - name: Send message
        uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58
        env:
          SLACK_COLOR: ${{ needs.noise-pfail-tests.result }}
          SLACK_MESSAGE: "GPU noise/pfail tests (${{ inputs.pattern }}, ${{ inputs.test_kind }}, ${{ inputs.params }}, ${{ inputs.platform }}) finished with status: ${{ needs.noise-pfail-tests.result }}. ([action run](${{ env.ACTION_RUN_URL }}))"

  teardown-instance:
    name: gpu_noise_pfail_tests/teardown-instance
    if: ${{ always() && needs.setup-instance.outputs.runner-name != '' }}
    needs: [setup-instance, noise-pfail-tests]
    uses: ./.github/workflows/slab_teardown.yml
    with:
      runner-name: ${{ needs.setup-instance.outputs.runner-name }}
      notification-context: gpu-noise-pfail-tests
    secrets:
      SLAB_ACTION_TOKEN: ${{ secrets.SLAB_ACTION_TOKEN }}
      SLAB_BASE_URL: ${{ secrets.SLAB_BASE_URL }}
      JOB_SECRET: ${{ secrets.JOB_SECRET }}
      SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
      BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
