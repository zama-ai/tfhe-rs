# Builds the tfhe forward data-compatibility matrix, surfaces it as a rendered
# table in the run summary, an artifact and a PR comment, and fails only when it
# no longer matches the committed baseline: a lost forward compatibility is
# acceptable, an unreviewed one is not.
name: forward_compatibility_matrix

on:
  workflow_dispatch:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "full"
  MATRIX_DIR: utils/tfhe-forward-compat-matrices
  BASELINE_FILE: matrix.baseline.csv

permissions: {}

jobs:
  forward-compatibility-matrix:
    name: forward_compatibility_matrix/forward-compatibility-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Need to write a PR comment
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout tfhe-rs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # zizmor: ignore[stale-action-refs] this action doesn't create releases
        with:
          toolchain: stable

      - name: Test the report generation
        run: make test_forward_compat_report

      # The generator rewrites the baseline in place and owns the verdict: it
      # compares statuses only, so a failure reason drifting on its own (a serde
      # bump, a variant added to a versioning enum) never turns the CI red.
      - name: Generate the compatibility matrix
        id: matrix
        run: |
          set +e
          make generate_forward_compat_matrix
          code="$?"
          set -e
          # Reported at the very end, once the report has been posted.
          if [ "${code}" -eq 2 ]; then
            echo "moved=true" >> "${GITHUB_OUTPUT}"
          elif [ "${code}" -ne 0 ]; then
            exit "${code}"
          fi

      - name: Render matrix in the run summary
        run: |
          MATRIX_FILE="${MATRIX_DIR}/matrix.md"
          if [ ! -s "${MATRIX_FILE}" ]; then
            echo "::error::${MATRIX_FILE} was not created the run produced no matrix"
            exit 1
          fi
          cat "${MATRIX_FILE}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Post report
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/sticky_report
        with:
          report-path: ${{ env.MATRIX_DIR }}/matrix.md
          header: forward-compat-matrix

      - name: Upload matrix artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forward-compat-matrix
          path: |
            ${{ env.MATRIX_DIR }}/matrix.md
            ${{ env.MATRIX_DIR }}/${{ env.BASELINE_FILE }}
          if-no-files-found: error

      - name: Fail if the baseline is out of date
        if: steps.matrix.outputs.moved == 'true'
        run: |
          echo "::error::The matrix no longer matches ${MATRIX_DIR}/${BASELINE_FILE}, see the PR comment."
          echo "::error::Run 'make generate_forward_compat_matrix' and commit the updated baseline."
          exit 1
