# Run cargo audit
name: cargo_audit

on:
  workflow_dispatch:
  schedule:
    # runs every day at 4am UTC
    - cron: "0 4 * * *"

env:
  CARGO_TERM_COLOR: always
  CHECKOUT_TOKEN: ${{ secrets.REPO_CHECKOUT_TOKEN || secrets.GITHUB_TOKEN }}

permissions: {}

# zizmor: ignore[concurrency-limits] only Zama organization members and GitHub can trigger this workflow

jobs:
  audit:
    name: cargo_audit/audit
    if: github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.repository == 'zama-ai/tfhe-rs')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
          token: ${{ env.CHECKOUT_TOKEN }}

      - name: Audit dependencies
        run: |
          make audit_dependencies

      - name: Slack Notification
        if: ${{ failure() }}
        continue-on-error: true
        uses: ./.github/actions/slack_notify
        with:
          status: ${{ job.status }}
          message: "cargo-audit finished with status: ${{ job.status }}."
          slack-webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack-channel: ${{ secrets.SLACK_CHANNEL }}
          slack-username: ${{ secrets.BOT_USERNAME }}
