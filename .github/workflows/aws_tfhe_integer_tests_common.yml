# Run the CPU integer tests of some parameter tiers, unsigned and signed tests in parallel
name: aws_tfhe_integer_tests_common

on:
  workflow_call:
    inputs:
      tiers:
        description: "Comma separated parameter tiers to test, e.g. 0 or 1,2"
        type: string
        required: true
    secrets:
      REPO_CHECKOUT_TOKEN:
        required: false
      SLACK_CHANNEL:
        required: false
      BOT_USERNAME:
        required: false
      SLACK_WEBHOOK:
        required: false

env:
  CARGO_TERM_COLOR: always
  ACTION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  RUSTFLAGS: "-C target-cpu=native"
  RUST_BACKTRACE: "full"
  RUST_MIN_STACK: "8388608"
  SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
  SLACK_ICON: https://pbs.twimg.com/profile_images/1274014582265298945/OjBKP9kn_400x400.png
  SLACK_USERNAME: ${{ secrets.BOT_USERNAME }}
  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
  SLACKIFY_MARKDOWN: true
  PULL_REQUEST_MD_LINK: ""
  # We clear the cache to reduce memory pressure because of the numerous processes of cargo
  # nextest
  TFHE_RS_CLEAR_IN_MEMORY_KEY_CACHE: "1"
  CHECKOUT_TOKEN: ${{ secrets.REPO_CHECKOUT_TOKEN || secrets.GITHUB_TOKEN }}

permissions:
  contents: read

# zizmor: ignore[concurrency-limits] caller workflow is responsible for the concurrency

jobs:
  integer-tests:
    name: aws_tfhe_integer_tests_common/integer-tests
    strategy:
      fail-fast: false
      matrix:
        sign: [unsigned, signed]
    runs-on: "runs-on=${{ github.run_id }}/runner=cpu-big"
    timeout-minutes: 480 # 8 hours
    env:
      SIGN: ${{ matrix.sign }}
      TIERS: ${{ inputs.tiers }}
    steps:
      - name: Checkout tfhe-rs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
          token: ${{ env.CHECKOUT_TOKEN }}

      - name: Install latest stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # zizmor: ignore[stale-action-refs] this action doesn't create releases
        with:
          toolchain: stable

      - name: Enable RAM huge pages
        run: |
          echo always | sudo tee /sys/kernel/mm/transparent_hugepage/enabled

      - name: Gen keys if required
        run: |
          make gen_key_cache
          make GEN_KEY_CACHE_MULTI_BIT_ONLY=TRUE gen_key_cache

      - name: Run integer tests
        run: |
          AVX512_SUPPORT=ON BIG_TESTS_INSTANCE=TRUE make "test_${SIGN}_integer_ci"

      - name: Set pull-request URL
        if: ${{ failure() && github.event_name == 'pull_request' }}
        run: |
          echo "PULL_REQUEST_MD_LINK=[pull-request](${PR_BASE_URL}${PR_NUMBER}), "  >> "${GITHUB_ENV}"
        env:
          PR_BASE_URL: ${{ vars.PR_BASE_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Slack Notification
        if: ${{ failure() || (cancelled() && github.event_name != 'pull_request') }}
        continue-on-error: true
        uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58
        env:
          SLACK_COLOR: ${{ job.status }}
          SLACK_MESSAGE: "Integer tests (${{ matrix.sign }}, tiers ${{ inputs.tiers }}) finished with status: ${{ job.status }}. (${{ env.PULL_REQUEST_MD_LINK }}[action run](${{ env.ACTION_RUN_URL }}))"
