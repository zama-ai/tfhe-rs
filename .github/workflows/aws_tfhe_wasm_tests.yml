name: aws_tfhe_wasm_tests

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  RUSTFLAGS: "-C target-cpu=native"
  RUST_BACKTRACE: "full"
  RUST_MIN_STACK: "8388608"
  CHECKOUT_TOKEN: ${{ secrets.REPO_CHECKOUT_TOKEN || secrets.GITHUB_TOKEN }}

on:
  # Allows you to run this workflow manually from the Actions tab as an alternative.
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

# zizmor: ignore[concurrency-limits] concurrency is managed after instance setup to ensure safe provisioning

jobs:
  should-run:
    name: aws_tfhe_wasm_tests/should-run
    if: github.event_name == 'workflow_dispatch' || contains(github.event.label.name, 'approved')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # Needed to check for file change
    outputs:
      wasm_test: ${{ github.event_name == 'workflow_dispatch' ||
        steps.changed-files.outputs.wasm_any_changed }}
    steps:
      - name: Checkout tfhe-rs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: "false"
          token: ${{ env.CHECKOUT_TOKEN }}

      - name: Check for file changes
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_yaml: |
            wasm:
                - Cargo.toml
                - tfhe/Cargo.toml
                - tfhe-csprng/**
                - tfhe-fft/**
                - tfhe-zk-pok/**
                - tfhe/src/core_crypto/**
                - tfhe/src/shortint/**
                - tfhe/src/integer/**
                - tfhe/src/transciphering/**
                - tfhe/src/high_level_api/**
                - tfhe/src/js_on_wasm_api/**
                - tfhe/js_on_wasm_tests/**
                - tfhe/tests/zk_wasm_x86_test/**
                - tfhe/tests/transciphering_wasm_x86_test/**
                - tfhe/web_wasm_parallel_tests/**
                - utils/tfhe-versionable/**
                - utils/tfhe-safe-serialize/**
                - .github/workflows/aws_tfhe_wasm_tests.yml

  wasm-tests:
    name: aws_tfhe_wasm_tests/wasm-tests
    needs: should-run
    if: github.event_name == 'workflow_dispatch' ||
      (contains(github.event.label.name, 'approved') && needs.should-run.outputs.wasm_test == 'true')
    concurrency:
      group: ${{ github.workflow_ref }}_${{github.event_name}}
      cancel-in-progress: true
    runs-on: "runs-on=${{ github.run_id }}/runner=cpu-small"
    steps:
      - name: Checkout tfhe-rs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
          token: ${{ env.CHECKOUT_TOKEN }}

      # GitHub has been causing issues with unauthenticated HTTPS traffic breaking several software
      - name: Authenticate all github.com git traffic
        run: |
          # single quotes expected to avoid replacing the token inline to not have it saved on disk
          # shellcheck disable=SC2016
          git config --global credential."https://github.com".helper '!f() { [ "$1" = get ] && printf "username=x-access-token\npassword=%s\n" "$CHECKOUT_TOKEN"; }; f'
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"

      - name: Install latest stable
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # zizmor: ignore[stale-action-refs] this action doesn't create releases
        with:
          toolchain: stable

      - name: Node setup
        run: |
          make install_aikido_safe_chain_ci
          echo "NODE_VERSION=$(make node_version)" >> "${GITHUB_ENV}"

      - name: Node cache restoration
        id: node-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: |
            .nvm
            .npm
          key: node-${{ env.NODE_VERSION }}

      - name: Install Node
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: |
          make install_node

      - name: Node cache save
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        if: steps.node-cache.outputs.cache-hit != 'true'
        with:
          path: |
            .nvm
            .npm
          key: node-${{ env.NODE_VERSION }}

      - name: Install web resources
        run: |
          make install_chrome_browser
          make install_chrome_web_driver
          make install_firefox_browser
          make install_firefox_web_driver

      - name: Run fmt checks
        run: |
          make check_fmt_js

      - name: Run Rust tests of the js on wasm API
        run: |
          make test_rust_wasm_api

      - name: Run js on wasm API tests
        run: |
          make test_nodejs_wasm_api_ci

      - name: Run wasm_par_mq tests
        run: |
          make test_wasm_par_mq_chrome_ci
          make test_wasm_par_mq_firefox_ci

      - name: Run parallel wasm tests
        run: |
          make test_web_js_api_parallel_chrome_ci
          make test_web_js_api_parallel_firefox_ci

      - name: Run cross origin wasm tests
        run: |
          make test_web_js_api_cross_origin_chrome_ci
          make test_web_js_api_cross_origin_firefox_ci

      - name: Run x86_64/wasm zk compatibility tests
        run: |
          make test_zk_wasm_x86_compat_ci

      - name: Run x86_64/wasm transciphering compatibility tests
        run: |
          make test_transciphering_wasm_x86_compat_ci

      - name: Slack Notification
        if: ${{ failure() || (cancelled() && github.event_name != 'pull_request') }}
        continue-on-error: true
        uses: ./.github/actions/slack_notify
        with:
          status: ${{ job.status }}
          message: "WASM tests finished with status: ${{ job.status }}."
          slack-webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack-channel: ${{ secrets.SLACK_CHANNEL }}
          slack-username: ${{ secrets.BOT_USERNAME }}
          pull-request-base-url: ${{ vars.PR_BASE_URL }}
