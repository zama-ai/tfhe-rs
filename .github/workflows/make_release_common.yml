# Common workflow to make crate release
name: make_release_common

on:
  workflow_call:
    inputs:
      package-name:
        type: string
        required: true
      dry-run:
        type: boolean
        default: true
    secrets:
      REPO_CHECKOUT_TOKEN:
        required: true
      SLACK_CHANNEL:
        required: true
      BOT_USERNAME:
        required: true
      SLACK_WEBHOOK:
        required: true
      ALLOWED_TEAM:
        required: true
      READ_ORG_TOKEN:
        required: true

permissions: {}

# zizmor: ignore[concurrency-limits] caller workflow is responsible for the concurrency

jobs:
  verify-triggering-actor:
    name: make_release_common/verify-triggering-actor
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/verify_triggering_actor.yml
    secrets:
      ALLOWED_TEAM: ${{ secrets.ALLOWED_TEAM }}
      READ_ORG_TOKEN: ${{ secrets.READ_ORG_TOKEN }}

  package:
    name: make_release_common/package
    runs-on: ubuntu-latest
    needs: verify-triggering-actor
    outputs:
      hash: ${{ steps.hash.outputs.hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: "false"
          token: ${{ secrets.REPO_CHECKOUT_TOKEN }}
      - name: Prepare package
        env:
          PACKAGE: ${{ inputs.package-name }}
        # --locked: fail rather than silently re-resolve if Cargo.lock is out of date, so a
        # release can never pick up a dependency version that was not already reviewed.
        run: cargo package --locked -p "${PACKAGE}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crate-${{ inputs.package-name }}
          path: target/package/*.crate
      - name: generate hash
        id: hash
        run: cd target/package && echo "hash=$(sha256sum ./*.crate | base64 -w0)" >> "${GITHUB_OUTPUT}"

  provenance:
    name: make_release_common/provenance
    if: ${{ !inputs.dry-run  }}
    needs: package
    # This action cannot be pinned to a specific commit (see https://github.com/slsa-framework/slsa-github-generator/blob/main/README.md#referencing-slsa-builders-and-generators)
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses] as said above SLSA cannot be pinned by tag today
    permissions:
      actions: read # Needed to detect the GitHub Actions environment
      id-token: write # Needed to create the provenance via GitHub OIDC
      contents: write # Needed to upload assets/artifacts
    with:
      # SHA-256 hashes of the Crate package.
      base64-subjects: ${{ needs.package.outputs.hash }}

  publish_release:
    name: make_release_common/publish-release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Needed for OIDC token exchange on crates.io
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: "false"
          token: ${{ secrets.REPO_CHECKOUT_TOKEN }}

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crate-${{ inputs.package-name }}
          path: target/package

      - name: Authenticate on registry
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish crate.io package
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          PACKAGE: ${{ inputs.package-name }}
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
        # DRY_RUN expansion cannot be double quoted when variable contains empty string otherwise cargo publish
        # would fail. This is safe since DRY_RUN is handled in the env section above.
        # --locked: see the packaging step. Matters most here, where a dependency build script
        # would run with CARGO_REGISTRY_TOKEN in the environment.
        run: |
          # shellcheck disable=SC2086
          cargo publish --locked -p "${PACKAGE}" ${DRY_RUN}

      - name: Generate hash
        id: published_hash
        run: cd target/package && echo "pub_hash=$(sha256sum ./*.crate | base64 -w0)" >> "${GITHUB_OUTPUT}"

      - name: Slack notification (hashes comparison)
        if: ${{ needs.package.outputs.hash != steps.published_hash.outputs.pub_hash }}
        continue-on-error: true
        uses: ./.github/actions/slack_notify
        with:
          status: failure
          message: "SLSA ${{ inputs.package-name }} - hash comparison failure."
          slack-webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack-channel: ${{ secrets.SLACK_CHANNEL }}
          slack-username: ${{ secrets.BOT_USERNAME }}

      - name: Slack Notification
        if: ${{ failure() }}
        continue-on-error: true
        uses: ./.github/actions/slack_notify
        with:
          status: ${{ job.status }}
          message: "${{ inputs.package-name }} release finished with status: ${{ job.status }}."
          slack-webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack-channel: ${{ secrets.SLACK_CHANNEL }}
          slack-username: ${{ secrets.BOT_USERNAME }}
