[package]
name = "tfhe-backward-compat-data"
edition = "2024"
version = "0.9.0"
license = "BSD-3-Clause-Clear"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
# Exact version: the generators rewrite the whole metadata files, so they must all use the same ron
# to produce the same format.
ron = { version = "=0.12.3", features = ["integer128"] }
ciborium = "0.2"
bincode = { workspace = true }
strum = { version = "0.28", features = ["derive"] }
semver = { version = "1.0" }
clap = { version = "4.6", features = ["derive"] }
